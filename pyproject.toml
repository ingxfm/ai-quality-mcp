[project]
name = "ai-quality-mcp"
version = "0.1.0"
description = "MCP server demo."
readme = "README.md"
authors = [
    { name = "Freddy", email = "ingxfm" }
]
requires-python = ">=3.14"
dependencies = [
    "bleach>=6.4.0",
    "fastapi>=0.141.1",
    "markdown>=3.10.3",
    "mcp[cli]>=2.0.0",
    "openai-agents>=0.21.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
ai-quality-mcp = "ai_quality_mcp:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
